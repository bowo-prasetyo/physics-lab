name: PR checklist

# The pull-request template's "Testing" checklist must say what was really done.
# This check fails on a ticked box that says it was not done, and on an unticked
# box without "Not done: <reason>". Explained not-done lines pass with a warning
# so the product owner sees them before merging. Re-runs when the description is edited.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  testing-checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The "Testing" checklist is honest
        env:
          # Passed as data, never interpolated into the script.
          BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-pr-checklist.sh
