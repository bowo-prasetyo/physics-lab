name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit:localization
      - run: npm run build
      - name: Upload localization audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-audit
          path: artifacts/localization-audit.*
          if-no-files-found: warn
          retention-days: 30
