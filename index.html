<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive physics experiments about space, time and motion." />
    <meta name="theme-color" content="#142b4a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Physica</title>
    <script>
      (() => {
        const supported = ['en', 'id', 'ja']
        let locale = null
        try {
          const stored = localStorage.getItem('physica-locale')
          if (supported.includes(stored)) locale = stored
        } catch {
          // Browser language detection remains available when storage is disabled.
        }
        if (!locale) {
          const languages = navigator.languages?.length ? navigator.languages : [navigator.language]
          for (const language of languages) {
            const normalized = language.toLowerCase()
            if (normalized === 'id' || normalized.startsWith('id-')) { locale = 'id'; break }
            if (normalized === 'ja' || normalized.startsWith('ja-')) { locale = 'ja'; break }
            if (normalized === 'en' || normalized.startsWith('en-')) { locale = 'en'; break }
          }
        }
        document.documentElement.lang = locale || 'en'

        let theme = 'system'
        try {
          const stored = localStorage.getItem('physica-theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') theme = stored
        } catch {
          // Use the system preference when local storage is unavailable.
        }
        const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false
        document.documentElement.dataset.theme = theme === 'system'
          ? (systemDark ? 'dark' : 'light')
          : theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
