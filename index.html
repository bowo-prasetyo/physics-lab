<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive physics experiments about space, time and motion." />
    <meta name="theme-color" content="#142b4a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Physica</title>
    <script>
      (() => {
        let preference = 'system'
        try {
          const stored = localStorage.getItem('physica-theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored
        } catch {
          // Use the system preference when local storage is unavailable.
        }
        const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false
        document.documentElement.dataset.theme = preference === 'system'
          ? (systemDark ? 'dark' : 'light')
          : preference
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
